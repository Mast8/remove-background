<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser-Based Background Remover</title>

  <link rel="stylesheet" href="style.css">

</head>
<body>

  <div class="container">
    <h1>Background Remover</h1>
    <p class="subtitle">Client-side AI image segmentation powered by WebAssembly</p>

    <!-- Upload Area -->
    <div class="drop-zone" id="drop-zone">
      <button class="btn" type="button">Choose Image</button>
      <p>or drag and drop your image file here</p>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <!-- Loading Indicator -->
    <div id="loader">
      <div class="spinner"></div>
      <p id="status-text">Processing...</p>
    </div>

    <!-- Image Previews -->
    <div class="preview-grid" id="preview-grid" style="display: none;">
      <div class="image-card">
        <h3>Original</h3>
        <div class="img-wrapper">
          <img id="original-img" alt="Original Image">
        </div>
      </div>
      <div class="image-card">
        <h3>Background Removed</h3>
        <div class="img-wrapper">
          <img id="processed-img" alt="Processed Image">
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="download-btn" class="btn" style="display: none;">
        Download PNG
      </button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
